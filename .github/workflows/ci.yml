name: Rencher
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux-job:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update && apt install -y \
            python3-dev \
            python3-pip \
            python3-venv \
            cmake \
            gobject-introspection \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libgtk-4-dev \
            patchelf \
            libadwaita-1-dev \
            ccache \
            blueprint-compiler \
            file \
            flatpak-builder \
            meson \
            nodejs
          pip install uv --break-system-packages

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}

      - name: Setup environment
        run: |
          uv sync
          meson setup build -Dprefix=$(pwd)/build/root
          ninja -C build install

      - name: Cache Flatpak runtimes
        uses: actions/cache@v6
        with:
          path: |
              /var/lib/flatpak
              .flatpak-builder
          key: flatpak-${{ runner.os }}-49

      - name: Package Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo --system
          flatpak install org.gnome.Sdk//49 org.gnome.Platform//49 --system -y --no-related
          flatpak-builder --install --user build/flatpak build-aux/flatpak/com.github.danatationn.rencher.yml
          flatpak build-bundle ~/.local/share/flatpak/repo build/Rencher.flatpak com.github.danatationn.rencher

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/Rencher.flatpak
          archive: false

  windows-job:
    name: Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-uv
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-python-cx-freeze

      - name: Get uv cache path
        id: uv-cache
        run: echo "path=$(uv cache dir)" >> $GITHUB_OUTPUT

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache.outputs.path }}
          key: uv-${{ runner.os }}

      - name: Setup Environment
        run: |
          uv sync
          meson setup build --prefix $(pwd)/build/root/
          ninja -C build install

      - name: Freeze Rencher
        id: freeze
        run: |
          ninja -C build freeze
          FREEZE_DIR=$(python -c "import sysconfig; print(f'exe.{sysconfig.get_platform()}-{sysconfig.get_python_version()}')")
          echo "FREEZE_DIR=$FREEZE_DIR" >> $GITHUB_OUTPUT

      - name: Upload frozen files artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rencher-Windows-Portable
          path: build/${{ steps.freeze.outputs.FREEZE_DIR }}

      - name: Build NSIS installer
        run: ninja -C build makensis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/RencherInstaller.exe
          archive: false
